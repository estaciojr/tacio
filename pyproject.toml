[project]
name = "tacio"
version = "0.1.0"
description = "Tacio: MCP Server para o Sankhya ERP, núcleo + packs por domínio"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2,<3",
  "pyodbc>=5.1",
  "sqlglot>=25",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tacio = "tacio.server:main"
tacio-operators = "tacio.operators.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tacio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
