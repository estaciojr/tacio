# Classificação das TOPs de entrada/compra por natureza — tenant Dalla.
#
# Fonte da verdade do Tacio para "o que é compra". Nada disso fica no código: outro cliente
# tem o próprio arquivo, e a futura tela de configuração edita este mesmo formato.
#
# Montado em 01/10/2026 a partir de:
#   - uso real das TOPs TIPMOV 'C' nos últimos 12 meses (notas, valor, parceiro, ATUALFIN);
#   - curadoria dos dashboards entradas_compras (grupos), rentabilidade_compras e DS 408.
# Os itens marcados  # REVISAR  dependem de confirmação de compras/fiscal (ver [pendencias]).
#
# Valores entre parênteses: notas / R$ em 12 meses (até 30/09/2026). "inativa" = sem movimento.

# --- naturezas ---------------------------------------------------------------------
# sinal: 1 soma, -1 subtrai (devolução).  compra: entra no padrão das tools de compra?
[naturezas.revenda]
nome = "Compra de revenda"
sinal = 1
compra = true

[naturezas.transferencia]
nome = "Transferência entre empresas Dalla"
sinal = 1
compra = false

[naturezas.bonificacao]
nome = "Bonificação / verba / amostra"
sinal = 1
compra = false

[naturezas.servico]
nome = "Serviço tomado"
sinal = 1
compra = false

[naturezas.consumo]
nome = "Uso e consumo"
sinal = 1
compra = false

[naturezas.utilidades]
nome = "Utilidades (energia, telefone, faturas)"
sinal = 1
compra = false

[naturezas.imobilizado]
nome = "Imobilizado / peças / obra"
sinal = 1
compra = false

[naturezas.complementar]
nome = "Nota complementar"
sinal = 1
compra = false

[naturezas.devolucao_compra]
nome = "Devolução de compra"
sinal = -1
compra = false

[naturezas.ajuste]
nome = "Ajuste de inventário / kit / implantação"
sinal = 1
compra = false

[naturezas.outras]
nome = "Outras entradas (remessa, consignado, conserto...)"
sinal = 1
compra = false

