# --- checagens automáticas (o Tacio avisa em vez de contar errado) ----------------
[checagens]
# TOP com movimento que não está em [tops] -> aviso "TOP não classificada".
avisar_top_nao_classificada = true
# Natureza 'revenda' com parceiro que é empresa do grupo (TSIEMP.CODPARC) -> aviso.
revenda_sem_parceiro_do_grupo = true
# Natureza 'transferencia' com parceiro de fora do grupo -> aviso.
transferencia_so_entre_empresas = true
# Empresas cadastradas na TSIEMP que vendem de verdade para a Dalla (revenda sem aviso).
parceiros_grupo_fornecedores = [
  575577,  # VERO DECOR (emp 13/25) — recebe importações e revende para a Dalla (confirmado 01/10/2026)
  215094,  # MEGA DESIGN (emp 18) — importadora (confirmado 01/10/2026)
  404171,  # VENETO (emp 17) — não é importadora; vende alguns itens específicos (confirmado 01/10/2026)
]

