# Risco: ainda tem estoque, mas cobre menos de 7 dias de venda. Visão para o comprador.
[operator]
id = "risco_ruptura_semanal"
nome = "Risco de ruptura (cobertura < 7 dias)"
agenda = "30 7 * * 1"             # segunda, 7h30
tool = "ruptura_por_loja"
params = { dias = 30, incluir_risco = true, cobertura_min_dias = 7, top = 200 }
canais = ["console"]
chave = ["CODEMP", "CODPROD"]
campos_msg = ["CODEMP", "CODPROD", "DESCRPROD", "DISPONIVEL", "COBERTURA_DIAS", "VLR_VENDIDO_PERIODO"]
avisar_resolvidos = false
analisar_com_llm = true
instrucao_llm = "Agrupe por loja. Destaque itens de maior valor vendido e cobertura abaixo de 3 dias."

[operator.filtro]
STATUS = ["RISCO"]

[operator.minimo]
VLR_VENDIDO_PERIODO = 500
